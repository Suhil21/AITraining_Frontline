[project]
name = "frontline"
version = "0.1.0"
description = "A ticket arrives; Frontline triages it and drafts a reply"
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "httpx>=0.28.1",
    "langchain-typesafe>=0.0.1a3",
    "litellm>=1.83.0",
    "openai>=3.24.0",
]

[dependency-groups]
dev = [
    "python-dotenv==1.2.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
pydocstyle.convention = "google"
